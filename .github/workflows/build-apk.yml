name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Check API URL variable
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Please set the repository variable VITE_API_URL to your Render URL first, e.g. https://xxx.onrender.com/api"
            exit 1
          fi

      - name: Install web dependencies
        run: npm install
        working-directory: web

      - name: Build web bundle
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: web

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: web/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Siraj-Al-Munir.apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Get version
        id: ver
        run: echo "V=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp web/android/app/build/outputs/apk/debug/app-debug.apk Al-Siraj-Al-Munir.apk

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.ver.outputs.V }}
          name: Al-Siraj Al-Munir v${{ steps.ver.outputs.V }}
          body: |
            تطبيق السِّراج المُنِير — نسخة رسمية قابلة للتثبيت على أجهزة أندرويد.
          artifacts: Al-Siraj-Al-Munir.apk
          artifactContentType: application/vnd.android.package-archive
          skipIfReleaseExists: true
          latest: true
